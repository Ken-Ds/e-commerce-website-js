<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/css/order-page.css">
    <title>Order Page</title>
</head>
<body>

    <section id="navbar"></section>

    <div class="productOrder-container">
        <div class="productOrder-main">
            <div class="productOrder-image">
                <img src="" alt="Product Image" id="productOrder-image">
            </div>
            <div class="productOrder-details">
                <h2 id="productOrder-name"></h2>
                <p id="productOrder-price"></p>
                <p id="productOrder-description"></p>
                <div class="quantityOrder-container">
                    <label for="quantity">Quantity:</label>
                    <button class="quantity-btn" id="decrease">−</button>
                    <input type="number" id="quantity" value="1" min="1">
                    <button class="quantity-btn" id="increase">+</button>
                </div>
                <p id="available-stock"></p>
                <div class="actions">
                    <button class="btn" id="buy-now">Buy Now</button>
                    <button class="btn" id="add-to-cart">Add To Cart</button>
                </div>
            </div>
        </div>
        <div class="other-products">
            <h3>Other Products</h3>
            <div class="products-grid" id="products-grid"></div>
    </div>

   
    <section id="footer"></section>
    <script>
        var org = null
        loadNavbar();
        fetchProductData();

        const addToCartBtn = document.getElementById('add-to-cart');
        addToCartBtn.addEventListener("click", function() {
            url = `/add-to-cart`;

            const productID = getParameterByName('productID');
            const quantity = document.getElementById('quantity').value;

            fetch(url , {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    productID: productID,
                    quantity: quantity
                })
            })
            .then(response => {
                            if (!response.ok) {
                                throw new Error(response.statusText);
                            }
                            return response.json();
            })
            .then(data => {
                alert(data.message);
            })
            .catch(error => {
                alert("Insufficient Stock!");
            });
        });

        // Handle Buy Now Button
        const buyNowButton = document.getElementById('buy-now');
        buyNowButton.addEventListener("click", function () {
            const productID = getParameterByName('productID');
            const quantity = parseInt(document.getElementById('quantity').value);

            if (quantity > availableStock) {
                alert('Insufficient stock available.');
                return;
            }

            fetch('/buy-now', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                productID: productID,
                quantity: quantity,
                orgID: org
            }),
        })
            .then(response => {
                console.log('Response:', response);
                if (!response.ok) {
                    console.error('Error response:', response);
                    throw new Error(response.statusText);
                }
                return response.json();
            })
            .then(data => {
                console.log('Buy Now success:', data);
                alert(data.message);
            })
            .catch(error => {
                console.error('Buy Now error:', error);
                alert('Error: ' + error.message);
            });
            
        });
    
        // Header
        function loadNavbar() {
                fetch('header.html')  
                    .then(response => response.text()) 
                    .then(html => {
                        document.getElementById('navbar').innerHTML = html; 
                    })
                    .catch(error => console.error('Error loading navbar:', error));
            }

        // Footer
        function loadFooter(){
            fetch('footer.html')  
                .then(response => response.text()) 
                .then(html => {
                    document.getElementById('footer').innerHTML = html; 
                })
                .catch(error => console.error('Error loading navbar:', error));
        }

            // Increase and Decrease Button
            const quantityInput = document.getElementById("quantity");
            const decreaseButton = document.getElementById("decrease");
            const increaseButton = document.getElementById("increase");

            // Increase 
            increaseButton.addEventListener("click", () => {
                let currentQuantity = parseInt(quantityInput.value); 
                if (currentQuantity < availableStock) {
                    currentQuantity++;
                    quantityInput.value = currentQuantity;
                } else {
                    alert("Quantity exceeds available stock!");
                }
            });

            // Decrease
            decreaseButton.addEventListener("click", () => {
                let currentQuantity = parseInt(quantityInput.value); 
                if (currentQuantity > 1) { 
                    currentQuantity--; 
                    quantityInput.value = currentQuantity;
                }
            });

            function fetchProductData(){
                const productID = getParameterByName('productID'); 
                var url = `/getproductdetails?productID=${productID}`;
                console.log("Fetching product details from: ", url)

                fetch(url)
                    .then(response => {
                        return response.json();
                    })
                    .then (data => {
                        renderProduct(data);
                        org = data.orgID;
                        fetchRelatedProducts(data.orgID);
                    })
                    .catch(error => {
                        console.error('Error fetching org details', error)
                        alert("error");
                })
            }

            function fetchRelatedProducts(orgID){
                var url = `/getproducts?orgID=${orgID}`;
                console.log("Fetching products from: ", url)

                fetch(url)
                    .then(response => {
                        return response.json();
                    })
                    .then (data => {
                        renderRelatedProducts(data);
                    })
                    .catch(error => {
                        console.error('Error fetching org details', error)
                        alert("error");
                    })
            } 
            
            function renderProduct(product) {
                try {
                    console.log(product);
                    document.getElementById("productOrder-image").src = product.pImage;
                    document.getElementById("productOrder-name").innerText= product.pName;
                    document.getElementById("productOrder-price").innerText = `₱ ${product.price}`;
                    document.getElementById("productOrder-description").innerText = product.pDesc;
                    document.getElementById("available-stock").innerText = `Available Stock: ${product.stock}`;

                    // Store available stock for validation
                    availableStock = product.stock;

                } catch (error) {
                    console.error('Error fetching product data:', error);
                }
            }

            function renderRelatedProducts(products){
                // Display other products from the same organization
                const productsGrid = document.getElementById("products-grid");
        
                products.forEach(otherProduct => {
                        const productItem = document.createElement("div");
                        productItem.classList.add("product-item");
                        productItem.innerHTML = `
                            <img src="${otherProduct.pImage}" alt="${otherProduct.pName}">
                            <p>${otherProduct.pName}</p>
                            <p>₱ ${otherProduct.price.toFixed(2)}</p>
                            
                        `;
                        
                        productsGrid.appendChild(productItem);
                });
            } 
 
            function getParameterByName(name) {
                const urlParams = new URLSearchParams(window.location.search);
                console.log(urlParams);
                return urlParams.get(name);
            }

            function getUserID() {
                return localStorage.getItem('userID'); 
            }
            
    </script>
</body>
</html>
