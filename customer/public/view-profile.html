<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/css/view-profile.css">
    <title>Profile Page</title>
</head>
<body>
    <div class="profile-container">
        <h1>My Profile</h1>
        <div class="profile-content">
            <div class="profile-picture">
                <p>Profile Picture</p>
            </div>
            <div class="profile-details">
                <h2>Basic Profile Details</h2>
                <div class="detail-row">
                    <div class="detail-item">
                        <span>First Name</span>
                        <p>Johny</p>
                    </div>
                    <div class="detail-item">
                        <span>Last Name</span>
                        <p>Bravo</p>
                    </div>
                </div>
                <hr>
                <div class="detail-row">
                    <div class="detail-item">
                        <span>User Name</span>
                        <p>johnyyy123</p>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-item">
                        <span>Email</span>
                        <p>johny@email.com</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
