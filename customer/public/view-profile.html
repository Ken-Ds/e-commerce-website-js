<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/css/view-profile.css">
    <title>Profile Page</title>
</head>
<body>
    <div id="header-placeholder"></div>
    
    <!-- Navbar placeholder -->
    <section id="navbar" style="padding-bottom: 140px;"></section>

    <div class="profile-container">
        <h1>My Profile</h1>
        <div class="profile-content">
            <div class="profile-picture">
                <img id="profileImg" src="" alt="Profile Picture" style="max-width: 600px; height: 300px;">
            </div>
            <div class="profile-details">
                <h2>Basic Profile Details</h2>
                <div class="detail-row">
                    <div class="detail-item">
                        <span>First Name</span>
                        <p id="firstName">Loading...</p>
                    </div>
                    <div class="detail-item">
                        <span>Last Name</span>
                        <p id="lastName">Loading...</p>
                    </div>
                </div>
                <hr>
                <div class="detail-row">
                    <div class="detail-item">
                        <span>User Name</span>
                        <p id="username">Loading...</p>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-item">
                        <span>Email</span>
                        <p id="email">Loading...</p>
                    </div>
                </div>
            </div>
        </div>
    </div> 

    <section class="trans"></section>
    <section id="footer"></section>

    <script>
        loadNavbar(); 
        loadUserProfile();
        loadFooter();


        function loadUserProfile() {
            const userID = new URLSearchParams(window.location.search).get('userID');

            if (userID) {
                fetch(`/getprofile?userID=${userID}`)
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('firstName').textContent = data.firstname;
                        document.getElementById('lastName').textContent = data.lastname;
                        document.getElementById('username').textContent = data.username;
                        document.getElementById('email').textContent = data.email;

                        if (data.uImg) {
                            document.getElementById('profileImg').src = data.uImg;
                        }
                    })
                    .catch(err => {
                        console.error('Error fetching profile:', err);
                        alert('Failed to load user profile');
                    });
            } else {
                alert('User ID is required to view the profile');
            }
        }

        function loadNavbar() {
            fetch('header.html')  
                .then(response => response.text()) 
                .then(html => {
                    document.getElementById('navbar').innerHTML = html; 
                })
                .catch(error => console.error('Error loading navbar:', error));
        }

        function loadFooter() {
            fetch('footer.html')  
                .then(response => response.text()) 
                .then(html => {
                    document.getElementById('footer').innerHTML = html; 
                })
                .catch(error => console.error('Error loading footer:', error));
        }
        
    </script>

</body>
</html>
