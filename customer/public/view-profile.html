<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style/css/view-profile.css" rel="stylesheet">
    <title>In Genius Orders</title>
</head>
<body>
    <section id="navbar" style="padding-bottom: 140px;"></section>
    <div class="profile-container">
        <div class="profile-section">
            <h2 id="username"></h2>
            <div class="logo-container">
                <img id="userImage" src="" alt="User Image" class="org-logo">
            </div>
        </div>
        
        <div class="organization-section">
            <h2>Profile</h2>
            <div class="organization-info">
                <ul>
                    <li><strong>Username: </strong> <span id="userUsername" class="org-info-text"></span></li>
                    <li><strong>Email: </strong> <span id="userEmail" class="org-info-text"></span></li>
                    <li><strong>Firstname: </strong> <span id="userFirstname" class="org-info-text"></span></li>
                    <li><strong>Lastname: </strong> <span id="userLastname" class="org-info-text"></span></li>
                </ul>
            </div>
        </div>
    </div>
    <section id="footer"></section>

    <script>
        loadNavbar();
        loadFooter();
        
        // Fetch user profile data from the backend
        fetch('/getprofile')  // Assuming the route for user profile is '/profile'
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert('Error: ' + data.error);
                    return;
                }

                // Set the profile details in the HTML
                document.getElementById('username').innerText = data.username;
                document.getElementById('userImage').src = data.uImg;
                document.getElementById('userUsername').innerText = data.username;
                document.getElementById('userEmail').innerText = data.email;
                document.getElementById('userFirstname').innerText = data.firstname;
                document.getElementById('userLastname').innerText = data.lastname;
            })
            .catch(err => {
                console.error('Error fetching user profile:', err);
            });
            function loadNavbar() {
            fetch('header.html')  
                .then(response => response.text()) 
                .then(html => {
                    document.getElementById('navbar').innerHTML = html; 
                })
                .catch(error => console.error('Error loading navbar:', error));
        }
    
        function loadFooter(){
            fetch('footer.html')  
                .then(response => response.text()) 
                .then(html => {
                    document.getElementById('footer').innerHTML = html; 
                })
                .catch(error => console.error('Error loading navbar:', error));
        }
    </script>
</body>
</html>
