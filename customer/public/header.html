<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Example</title>
    <link rel="stylesheet" href="../style/css/header.css">
</head>
<body>
    <header class="main-header">
        <div class="logo-section">
            <img class="logo" src="../../shared/style/img/logo.png" alt="Logo of INGS">
            <div class="brand-name">INGS</div>
        </div>
        <div class="search-section">
            <input type="text" class="search-bar" placeholder="Search...">
            <button class="search-button">
                <img src="../style/img/search.png" alt="Search Icon" class="search-icon">
            </button>
            <button class="cart-button">
                <img src="../style/img/shopping.png" alt="Cart Icon" class="cart-icon">
            </button>
            <button class="bag-button">
                <img src="../style/img/bag.png" alt="Bag Icon" class="bag-icon">
            </button>
        </div>
        
        <div class="profile-logout-section">
           
            <a href="#" class="profile">
                <img src="../style/img/profile.png" alt="Profile Icon" class="profile-icon">
                <span class="username">sampleuser</span>
            </a>
            <button class="logout-button">Logout</button>
        </div>
    </header>
</body>
</html>
