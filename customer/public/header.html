<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <header class="main-header text-white py-3 shadow-sm" style="background-color: #2c2e5f;">

        <div class="container d-flex justify-content-between align-items-center">
            <!-- Logo Section -->
            <div class="d-flex align-items-center">
                <a href="view-booths.html">
                    <img class="logo me-2" src="/style/img/logo.png" alt="Logo of INGS" style="height: 100px; margin-top: 10px; margin-left: 20px;">

                </a>
                <span class="fs-4 fw-bold">INGS</span>
            </div>

            <!-- Search Section -->
            <form class="d-flex w-50">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Search..." aria-label="Search">
                    <button class="btn btn-outline-secondary" type="submit">
                        <img src="/style/img/search-btn.png" alt="Search Icon" style="width: 20px; height: 20px;">
                    </button>
                </div>
            </form>

            <!-- Action Buttons Section -->
            <div class="d-flex align-items-center">
                <a href="view-cart.html">
                    <button class="btn btn-outline-light me-2">
                        <img src="/style/img/shopping.png" alt="Cart Icon" style="width: 24px;">
                    </button>
                </a>
                <a href="view-transactions.html">
                    <button class="btn btn-outline-light me-3">
                        <img src="/style/img/list.png" alt="Bag Icon" style="width: 24px;">
                    </button>
                </a>

                <!-- Profile Section -->
                <div class="d-flex align-items-center me-3">
                   
                     <a href="view-profile.html" style="text-decoration: none;">
                      <img src="../style/img/profile.png" alt="Profile Icon" class="rounded-circle me-2" style="width: 30px; height: 30px;">
                         <span class="username text-white">Profile</span>
                         </a>
                </div>

                <!-- Logout Button -->
                <button class="btn btn-outline-light ">
                    Logout
                </button>
            </div>
        </div>
    </header>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFylzcLA8Nl+NtUVF0sA7MsXJZ1Zn9w7e7r9kaMjk58V+9J0kxX0URy4LP" crossorigin="anonymous"></script>
</body>
</html>
