<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Cart</title>
    <link rel="stylesheet" href="../style/css/view-transactions.css">
</head>

<body>
    <section class="filter-bar">
        <p>All</p>
        <p>Claimed</p>
        <p>Unclaimed</p>
    </section>

    <section class="page">
        
        <section class="row">
            <table class="row-table">
                <thead>
                    <th>Product(s)</th>
                    <th>Quantity</th>
                    <th>Amount</th>
                    <th>Order Date</th>
                    <th>Status</th>
                </thead>
            </table>
        </section>
    
        <section class="transactions-box">
            <div class="organization-name">
                <P>Organization Name</P>
            </div>

            <table class="details-table">
                <tbody>
                    <tr>
                        <td>Product 1</td>
                        <td>2</td>
                        <td>Amount</td>
                        <td>Order Date</td>
                        <td>Status</td>
                    </tr>
                </tbody>
            </table>

            <table class="details-table">
                <tbody>
                    <tr>
                        <td>Product 100</td>
                        <td>2</td>
                        <td>Amount</td>
                        <td>Order Date</td>
                        <td>Status</td>
                    </tr>
                </tbody>
            </table>

        </section>

    </section>

</body>
</html>
