<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/css/search.css">
    <title>Organization Products</title>
</head>
<body>
    <section id="navbar" style="padding-bottom: 140px;"></section>
    <div class="organization-header">
        
        <div class="image-container">
            <img id="organization-logo" src="" alt="Organization Image" class="organization-image">
        </div>
        <h1 id="organization-name" class="organization-name">Loading...</h1>
    </div>

    <div class="products-container">
        <h2>Our Products</h2>
        <div id="product-list" class="product-list"></div>
    </div>

    <section class="trans"></section>
    <section id="footer" style="padding-top: 3%;"></section>

    <script>
        loadNavbar();
        
        // Utility to get query parameters
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }
    
        const productName = getQueryParam('query');
    
        // Fetch and display products
        async function fetchProducts(productName) {
            try {
                const response = await fetch(`/search?productName=${encodeURIComponent(productName)}`);
                if (!response.ok) {
                    throw new Error('Product not found or server error.');
                }

                const data = await response.json();

               
                if (!data.product) {
                    alert('Product is not available');
                    return;
                }

               
                const orgLogo = document.getElementById('organization-logo');
                const orgName = document.getElementById('organization-name');

                orgLogo.src = data.organization.logo || '/customer/public/style/img/default-logo.jpg';
                orgName.textContent = data.organization.name;

                const productList = document.getElementById('product-list');
                productList.innerHTML = ''; 

                const product = data.product;

                const productItem = document.createElement('div');
                productItem.className = 'product-item';

                const productImage = document.createElement('img');
                productImage.src = product.image || '/customer/public/style/img/default-product.jpg';
                productImage.alt = product.name;
                productImage.className = 'product-image';

                const productDetails = document.createElement('div');
                productDetails.className = 'product-details';

                const productNameElement = document.createElement('h3');
                productNameElement.className = 'product-name';
                productNameElement.textContent = product.name;

                const productDescription = document.createElement('p');
                productDescription.className = 'product-description';
                productDescription.textContent = product.description;

                const productPrice = document.createElement('span');
                productPrice.className = 'product-price';
                productPrice.textContent = `₱${product.price.toFixed(2)}`;

                productDetails.append(productNameElement, productDescription, productPrice);
                productItem.append(productImage, productDetails);
                productList.appendChild(productItem);
            } catch (error) {
                console.error('Error fetching product data:', error);
                alert('Unable to load products. Please try again.');
            }
        }

        
        function addToCart(product) {
            console.log('Product added to cart:', product);
        }
    
        
        function loadNavbar() {
            fetch('header.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('navbar').innerHTML = html;
                })
                .catch(error => console.error('Error loading navbar:', error));
        }
    
        
        function loadFooter() {
            fetch('footer.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('footer').innerHTML = html;
                })
                .catch(error => console.error('Error loading footer:', error));
        }
    
        
        document.addEventListener('DOMContentLoaded', () => {
            fetchProducts(productName);
            loadFooter();
        });
    </script>
</body>
</html>
