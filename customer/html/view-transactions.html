<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Cart</title>
    <link rel="stylesheet" href="../style/css/view-transactions.css">
</head>

<body>
    <section class="filter-bar">
        <p>All</p>
        <p>Claimed</p>
        <p>Unclaimed</p>
    </section>

    <section class="page">
        
        <section class="row">
            <p>Product(s)</p>
            <p>Quantity</p>
            <p>Amount</p>
            <p>Order Date</p>
            <p>Status</p>
        </section>
    
        <section class="transactions-box">
            <div class="organization-name">
                <P>Organization Name</P>
            </div>

            <table class="details">
                <thead>
                    <tr>
                        <th>Hello</th>
                        <th>World</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th>Hello</th>
                        <th>World</th>
                    </tr>
                </tbody>
            </table>
        </section>

    </section>

</body>
</html>
